<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reset Password | IsMyWaterOK</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/community.css">
</head>
<body>
  <nav class="community-topbar" aria-label="Main navigation"><a href="/">IsMyWaterOK</a><div class="community-topbar-links"><a href="/account.html">Account</a><a href="/contact.html">Contact</a></div></nav>
  <main class="community-page">
    <section class="community-card reset-card">
      <p class="section-kicker">ACCOUNT SECURITY</p>
      <h1>Choose a new password</h1>
      <form id="reset-password-form" class="community-form">
        <label><span>New password</span><input id="reset-password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label><span>Confirm new password</span><input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="primary-button" type="submit">Change password</button>
        <p id="reset-status" class="form-status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="/community.js"></script>
</body>
</html>
