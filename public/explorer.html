<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Data Explorer</title></head><body><main class="wrap"><h1>Official metal-record explorer</h1><p><a href="/">← Address checker</a></p><input id="q" placeholder="Search system, metal, PWSID"><div id="count"></div><div id="rows"></div></main><script>let all=[];fetch('/api/explorer').then(r=>r.json()).then(d=>{all=d.records;draw()});q.oninput=draw;function draw(){let t=q.value.toLowerCase(),r=all.filter(x=>JSON.stringify(x).toLowerCase().includes(t)).slice(0,500);count.textContent=`Showing ${r.length} matching rows`;rows.innerHTML=r.map(x=>`<div class="card"><b>${x.system_name}</b> · ${x.metal}<br>${x.sample_date}: ${x.result??'—'} ${x.unit||''}<br><span class="muted">PWS ${x.pwsid}; sample type ${x.sample_type||'—'}; MCL ${x.mcl??'—'}</span></div>`).join('')}</script></body></html>
