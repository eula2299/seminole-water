name: National release verification
on:
  pull_request:
    paths:
      - 'national/**'
      - 'tests/national*'
      - 'platform.js'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/national-release-verification.yml'
permissions:
  contents: read
concurrency:
  group: national-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: water_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/water_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export exact checked-out source
        run: git archive --format=zip HEAD -o /tmp/national-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: national-source
          path: /tmp/national-source.zip
          retention-days: 3
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r national/requirements.txt -r national/warehouse-requirements.txt
      - name: Full original regression suite
        run: npm run test:all
      - name: National regression suite
        if: always()
        run: node --test tests/national_*.test.js
      - name: Bounded import and environmental pipeline tests
        if: always()
        run: python -m unittest discover -s tests -p 'test_national*.py' -v
  catalogue-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mdbtools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r national/warehouse-requirements.txt
      - run: python national/catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-catalog-probe
          path: national-catalog-probe.json
          retention-days: 3
