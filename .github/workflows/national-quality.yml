name: National archive quality
on:
  pull_request:
    paths:
      - 'national/warehouse.py'
      - 'tests/test_national_warehouse*'
      - '.github/workflows/national-quality.yml'
permissions:
  contents: read
jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r national/warehouse-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_national_warehouse*.py' -v
