name: National domestic well source
on:
  pull_request:
    paths: ['scripts/inspect_domestic_well_source.py', 'national/domestic_well_archive.py', '.github/workflows/national-domestic-well-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.inspect_domestic_well_source
      - name: Check the normal public download page without signing in
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import json,pathlib,urllib.parse
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch()
              context=browser.new_context(accept_downloads=False)
              page=context.new_page()
              page.goto('https://sciencebase.usgs.gov/manager/download/cmi3tlgef00090to6cscucg4s',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_timeout(8000)
              result={'host':urllib.parse.urlsplit(page.url).hostname,'path':urllib.parse.urlsplit(page.url).path,'title':page.title(),'visible_text':page.locator('body').inner_text()[:15000],'buttons':page.get_by_role('button').all_text_contents(),'signed_in':False,'data_downloaded':False}
              pathlib.Path('verification/domestic-well-source/browser-contract.json').write_text(json.dumps(result,indent=2))
              print(json.dumps(result,indent=2))
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domestic-well-source-contract
          path: verification/domestic-well-source/
          retention-days: 7
  deployed-warehouse-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python national/live_acceptance.py
      - name: Print acquired counts without conflating source families
        run: |
          python - <<'PY'
          import json
          d=json.load(open('national-live-acceptance.json'))
          a=d['status']['historical_archive']
          print(json.dumps({'checked_at':d['checked_at'],'health':d['health'],'counts':{k:a.get(k) for k in ['retained_source_records','eligible_source_records','published_archives','ingestion_status','errors']},'microbial_sources':{k:v for k,v in a['sources'].items() if k in ['syr3_ec-fc-dr','syr3_tc-dr-06-08','syr3_tc-dr-09-11']},'environmental_archive':{k:v for k,v in a.get('environmental_archive',{}).items() if k not in ['partitions','sources']},'well_archive':{k:v for k,v in a.get('well_archive',{}).items() if k!='sources'}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-warehouse-readback
          path: national-live-acceptance.json
          retention-days: 30
