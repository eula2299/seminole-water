name: Resident roadmap check
on:
  push:
    branches: [main, feature/full-roadmap-complete, fix/result-priority, feature/google-feedback, fix/google-login-diagnostics, fix/clean-result-flow]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: npm install --ignore-scripts
      - name: Load production community dependencies
        run: node -e "require('pg'); require('nodemailer'); require('google-auth-library'); console.log('community dependencies loaded')"
      - name: Compile resident and community JavaScript
        run: |
          node --check public/roadmap-data.js
          node --check public/roadmap.js
          node --check public/pages.js
          node --check public/page-tracking.js
          node --check public/resident-actions.js
          node --check public/community.js
          node --check public/account.js
          node --check public/google-diagnostics.js
          node --check public/feedback.js
          node --check public/feedback-entry.js
          node --check public/app.js
          node --check public/result-priority.js
          node --check public/clean-result-flow.js
          node --check platform.js
          node --check lib/community_store.js
          node --check lib/community_mailer.js
          node --check scripts/send_digest.js
      - name: Run resident roadmap regression tests
        run: node --test tests/simple_frontend.test.js tests/community.test.js tests/result_priority.test.js
