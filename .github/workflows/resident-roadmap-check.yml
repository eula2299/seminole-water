name: Resident roadmap check
on:
  push:
    branches: [main, feature/full-roadmap]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile resident JavaScript
        run: |
          node --check public/roadmap-data.js
          node --check public/roadmap.js
          node --check public/pages.js
          node --check public/page-tracking.js
          node --check public/resident-actions.js
          node --check public/app.js
      - name: Run resident frontend regression tests
        run: node --test tests/simple_frontend.test.js
