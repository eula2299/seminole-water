name: National deployed release
on:
  push:
    branches: [main]
    paths: ['national/resident-ui.js', 'national/evaluations/**', '.github/workflows/national-deployed-release.yml']
permissions:
  contents: read
jobs:
  verify-running-release:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the deployed frontend commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          for attempt in range(18):
              try:
                  with urllib.request.urlopen('https://www.ismywaterok.com/healthz',timeout=10) as r: health=json.load(r)
                  if health.get('commit')==os.environ['EXPECTED_COMMIT'] and health.get('process')=='up':
                      print(json.dumps(health));break
              except Exception as e: print(type(e).__name__)
              time.sleep(10)
          else: raise SystemExit('Expected frontend release not observed')
          PY
      - name: Execute the served resident client in the layout contract
        env:
          LIVE_ORIGIN: https://www.ismywaterok.com
        run: node --test tests/national_resident_layout.test.js
      - run: python national/live_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-deployed-release-evidence
          path: national-live-acceptance.json
          retention-days: 30
